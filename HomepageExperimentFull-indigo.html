<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Experiment - Elegant Indigo & Ivory</title>
  <style>
    body { background: #F8F8F8; margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    .homepage-header {
      background: #2C3E50;
      color: #fff;
      padding: 1.1rem 0 0.7rem 0;
      text-align: center;
      border-radius: 0;
      box-shadow: 0 2px 12px #0002;
      margin-bottom: 0.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-content { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    .site-title { font-size: 2rem; font-weight: 900; letter-spacing: -1px; margin: 0; text-shadow: 0 2px 8px #0002; text-align: left; flex: 1; cursor: pointer; }
    .tabs { display: flex; gap: 1.1rem; margin: 0; flex: 1.5; justify-content: flex-end; flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
    .tab { font-size: 0.97rem; font-weight: 600; padding: 0.38rem 1.25rem; border-radius: 999px; background: #fff; color: #2C3E50; border: none; box-shadow: 0 2px 8px #BFC9CA22; cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; margin-bottom: 0; outline: none; border-top: 3px solid transparent; min-height: 36px; line-height: 1.1; white-space: nowrap; }
    .tab.active, .tab:hover { background: #2C3E50; color: #fff; box-shadow: 0 4px 16px #2C3E5044; border-top: 3px solid #F7CA18; }
    .hero-section { background: #fff; padding: 3.5rem 1rem 2.5rem 1rem; text-align: center; box-shadow: 0 2px 24px #BFC9CA22; }
    .hero-content { max-width: 900px; margin: 0 auto; }
    .hero-title { font-size: 2.7rem; font-weight: 900; color: #2C3E50; margin-bottom: 1.2rem; letter-spacing: -1px; }
    .hero-subtitle { font-size: 1.2rem; color: #23223a; font-weight: 500; margin-bottom: 2.2rem; max-width: 700px; margin-left: auto; margin-right: auto; }
    .hero-benefits { display: flex; gap: 2.5rem; justify-content: center; margin-top: 2.5rem; flex-wrap: wrap; }
    .benefit-card { background: #fff; border-radius: 1.2rem; box-shadow: 0 2px 16px #BFC9CA22; padding: 1.2rem 1.5rem; min-width: 220px; max-width: 280px; flex: 1 1 220px; display: flex; flex-direction: column; align-items: center; transition: box-shadow 0.2s, transform 0.2s; margin-bottom: 1.5rem; }
    .benefit-card:hover { box-shadow: 0 6px 24px #2C3E5033; transform: translateY(-4px) scale(1.03); }
    .benefit-card h3 { color: #2C3E50; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
    .benefit-card p { color: #F7CA18; font-size: 1rem; }
    .benefit-card span { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .cta-btn { background: #F7CA18; color: #2C3E50; font-weight: 700; font-size: 1.1rem; padding: 0.8rem 2.2rem; border: none; border-radius: 2rem; box-shadow: 0 2px 12px #BFC9CA44; cursor: pointer; transition: background 0.2s; margin-top: 2rem; }
    .cta-btn:hover { background: #2C3E50; color: #fff; }
  </style>
</head>

</html>
