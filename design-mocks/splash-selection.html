<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Selection Splash Design Mock</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .splash-btn { font-size: 1.3rem; padding: 1.5rem 3rem; margin: 1rem; border-radius: 1rem; border: none; background: #3b0ca3; color: #fff; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px #0002; transition: background 0.2s; }
    .splash-btn:hover { background: #5f2eea; }
    .input-bar { background: #e0e7ff; padding: 1rem 2rem; border-radius: 0.7rem; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; }
    .input-bar label { font-weight: 600; }
    .input-bar input { padding: 0.5rem; border-radius: 0.3rem; border: 1px solid #bbb; }
    @media (max-width: 600px) { .input-bar { flex-direction: column; gap: 0.5rem; padding: 1rem; } .splash-btn { width: 100%; } }
  </style>
</head>
<body>
  <div class="center">
    <div class="input-bar">
      <label for="city">City:</label>
      <input id="city" placeholder="e.g. Boston" />
      <label for="school">School:</label>
      <input id="school" placeholder="e.g. Harvard" />
      <label for="culture">Culture:</label>
      <input id="culture" placeholder="e.g. Indian" />
      <button style="padding:0.5rem 1rem; border-radius:0.3rem; background:#3b0ca3; color:#fff; border:none;">Update</button>
    </div>
    <button class="splash-btn">Preserve My Culture</button>
    <button class="splash-btn">Cultural Understanding</button>
    <p style="color:#888; margin-top:2rem;">(Choose a mode to continue. You can switch later.)</p>
  </div>
</body>
</html>
