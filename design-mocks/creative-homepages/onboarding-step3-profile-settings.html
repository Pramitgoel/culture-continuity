<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culture Continuity - Step 3: Profile Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(120deg, #f8fafc 0%, #f7e9d7 100%);
      color: #23223a;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-settings-container {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 8px 48px #eab67655;
      border: 2.5px solid #eab67688;
      padding: 2.5rem 2.5rem 2rem 2.5rem;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popin 0.4s cubic-bezier(.6,-0.28,.74,.05);
    }
    @keyframes popin {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .profile-settings-title {
      font-size: 2rem;
      font-weight: 900;
      color: #b77b2b;
      margin-bottom: 1.2rem;
      text-align: center;
      text-shadow: 0 2px 12px #eab67644;
    }
    .profile-settings-desc {
      font-size: 1.1rem;
      color: #23223a;
      font-weight: 500;
      margin-bottom: 2rem;
      text-align: center;
      max-width: 340px;
    }
    .profile-settings-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .profile-settings-label {
      font-weight: 700;
      color: #b77b2b;
      margin-bottom: 0.3rem;
      font-size: 1rem;
    }
    .profile-settings-input, .profile-settings-select {
      padding: 0.8rem 1rem;
      border-radius: 0.7rem;
      border: 2px solid #eab67688;
      font-size: 1rem;
      background: #fff8e1;
      color: #23223a;
      outline: none;
      transition: border 0.2s;
    }
    .profile-settings-input:focus, .profile-settings-select:focus {
      border: 2px solid #b77b2b;
    }
    .profile-settings-btn {
      margin-top: 2rem;
      background: linear-gradient(90deg, #eab676 0%, #b77b2b 100%);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 1.1rem 2.7rem;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px #eab67644;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
      text-shadow: 0 0 8px #eab676cc;
    }
    .profile-settings-btn:hover {
      background: linear-gradient(90deg, #b77b2b 0%, #eab676 100%);
      color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px #eab67644;
    }
  </style>
</head>
<body>
  <div class="profile-settings-container">
    <div class="profile-settings-title">Profile & Settings</div>
    <div class="profile-settings-desc">Update your college, location, or cultural background anytime to keep your experience personalized.</div>
    <form class="profile-settings-form">
      <div>
        <label class="profile-settings-label" for="college">College/University</label>
        <input class="profile-settings-input" type="text" id="college" name="college" value="Delhi University" required>
      </div>
      <div>
        <label class="profile-settings-label" for="location">Location</label>
        <input class="profile-settings-input" type="text" id="location" name="location" value="New Delhi" required>
      </div>
      <div>
        <label class="profile-settings-label" for="culture">Cultural Background</label>
        <select class="profile-settings-select" id="culture" name="culture" required>
          <option value="hindi" selected>Hindi</option>
          <option value="bengali">Bengali</option>
          <option value="punjabi">Punjabi</option>
          <option value="tamil">Tamil</option>
          <option value="telugu">Telugu</option>
          <option value="marathi">Marathi</option>
          <option value="gujarati">Gujarati</option>
          <option value="malayali">Malayali</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button class="profile-settings-btn" type="submit">Save Changes</button>
    </form>
  </div>
</body>
</html>
