<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culture Continuity - Split Hero Alt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #23223a;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .hero-split {
      display: flex;
      flex-direction: row;
      min-height: 100vh;
      width: 100vw;
    }
    .hero-left {
      flex: 1.1;
      background: linear-gradient(120deg, #eab676 0%, #fff8e1 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding: 4rem 2.5rem 4rem 2rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 32px #eab67622;
    }
    .hero-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: #b77b2b;
      margin-bottom: 1.2rem;
      text-align: right;
      text-shadow: 0 2px 12px #eab67644;
      letter-spacing: -1px;
    }
    .hero-tagline {
      font-size: 1.2rem;
      color: #23223a;
      font-weight: 500;
      margin-bottom: 2.5rem;
      text-align: right;
      max-width: 400px;
    }
    .hero-btns {
      margin-top: 2.5rem;
      display: flex;
      gap: 1.2rem;
      justify-content: flex-end;
    }
    .hero-btn {
      background: linear-gradient(90deg, #eab676 0%, #b77b2b 100%);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 1.1rem 2.7rem;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px #eab67644;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
      text-shadow: 0 0 8px #eab676cc;
    }
    .hero-btn:hover {
      background: linear-gradient(90deg, #b77b2b 0%, #eab676 100%);
      color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px #eab67644;
    }
    .hero-right {
      flex: 1.3;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .hero-illustration {
      width: 90%;
      max-width: 520px;
      margin: 0 auto;
      display: block;
      filter: drop-shadow(0 8px 32px #eab67644);
    }
    @media (max-width: 900px) {
      .hero-split { flex-direction: column; }
      .hero-left, .hero-right { flex: unset; width: 100vw; min-height: 320px; }
      .hero-title, .hero-tagline, .hero-btns { text-align: left; align-items: flex-start; }
      .hero-right { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="hero-split">
    <div class="hero-left">
      <div class="hero-title">Welcome to Culture Continuity</div>
      <div class="hero-tagline">Find your community, celebrate your heritage, and discover the world around you. Your journey to cultural connection and understanding starts here.</div>
      <div class="hero-btns">
        <button class="hero-btn">🛡️ Preserve My Culture</button>
        <button class="hero-btn">🌏 Explore Local Cultures</button>
      </div>
    </div>
    <div class="hero-right">
      <svg class="hero-illustration" viewBox="0 0 400 400">
        <ellipse cx="200" cy="200" rx="180" ry="120" fill="#eab676" fill-opacity="0.18"/>
        <ellipse cx="200" cy="220" rx="120" ry="60" fill="#b77b2b" fill-opacity="0.13"/>
        <g>
          <circle cx="120" cy="180" r="38" fill="#eab676"/>
          <rect x="90" y="218" width="60" height="90" rx="30" fill="#b77b2b"/>
          <ellipse cx="120" cy="310" rx="38" ry="18" fill="#eab676"/>
          <circle cx="280" cy="180" r="38" fill="#b77b2b"/>
          <rect x="250" y="218" width="60" height="90" rx="30" fill="#eab676"/>
          <ellipse cx="280" cy="310" rx="38" ry="18" fill="#b77b2b"/>
        </g>
        <g>
          <rect x="190" y="100" width="20" height="60" rx="10" fill="#b77b2b"/>
          <ellipse cx="200" cy="100" rx="10" ry="9" fill="#eab676"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
