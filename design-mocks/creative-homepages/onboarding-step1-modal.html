<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culture Continuity - Onboarding Step 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(120deg, #f8fafc 0%, #f7e9d7 100%);
      color: #23223a;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(34, 34, 34, 0.18);
      z-index: 0;
    }
    .onboarding-modal {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 8px 48px #eab67655;
      border: 2.5px solid #eab67688;
      padding: 2.5rem 2.5rem 2rem 2.5rem;
      max-width: 420px;
      width: 100%;
      z-index: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popin 0.4s cubic-bezier(.6,-0.28,.74,.05);
    }
    @keyframes popin {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .onboarding-title {
      font-size: 2rem;
      font-weight: 900;
      color: #b77b2b;
      margin-bottom: 1.2rem;
      text-align: center;
      text-shadow: 0 2px 12px #eab67644;
    }
    .onboarding-desc {
      font-size: 1.1rem;
      color: #23223a;
      font-weight: 500;
      margin-bottom: 2rem;
      text-align: center;
      max-width: 340px;
    }
    .onboarding-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .onboarding-label {
      font-weight: 700;
      color: #b77b2b;
      margin-bottom: 0.3rem;
      font-size: 1rem;
    }
    .onboarding-input, .onboarding-select {
      padding: 0.8rem 1rem;
      border-radius: 0.7rem;
      border: 2px solid #eab67688;
      font-size: 1rem;
      background: #fff8e1;
      color: #23223a;
      outline: none;
      transition: border 0.2s;
    }
    .onboarding-input:focus, .onboarding-select:focus {
      border: 2px solid #b77b2b;
    }
    .onboarding-btn {
      margin-top: 2rem;
      background: linear-gradient(90deg, #eab676 0%, #b77b2b 100%);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 1.1rem 2.7rem;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px #eab67644;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
      text-shadow: 0 0 8px #eab676cc;
    }
    .onboarding-btn:hover {
      background: linear-gradient(90deg, #b77b2b 0%, #eab676 100%);
      color: #fff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px #eab67644;
    }
  </style>
</head>
<body>
  <div class="modal-bg"></div>
  <div class="onboarding-modal">
    <div class="onboarding-title">Let's Get Started</div>
    <div class="onboarding-desc">Tell us a bit about yourself to personalize your experience. You can update these details later in your profile.</div>
    <form class="onboarding-form">
      <div>
        <label class="onboarding-label" for="college">College/University</label>
        <input class="onboarding-input" type="text" id="college" name="college" placeholder="e.g. Delhi University" required>
      </div>
      <div>
        <label class="onboarding-label" for="location">Location</label>
        <input class="onboarding-input" type="text" id="location" name="location" placeholder="e.g. New Delhi" required>
      </div>
      <div>
        <label class="onboarding-label" for="culture">Cultural Background</label>
        <select class="onboarding-select" id="culture" name="culture" required>
          <option value="">Select...</option>
          <option value="hindi">Hindi</option>
          <option value="bengali">Bengali</option>
          <option value="punjabi">Punjabi</option>
          <option value="tamil">Tamil</option>
          <option value="telugu">Telugu</option>
          <option value="marathi">Marathi</option>
          <option value="gujarati">Gujarati</option>
          <option value="malayali">Malayali</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button class="onboarding-btn" type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
