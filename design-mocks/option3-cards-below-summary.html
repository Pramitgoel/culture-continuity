<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 3: Cards Below Summary</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .full-form { max-width: 520px; margin: 3rem auto; background: #fff; border-radius: 1.2rem; box-shadow: 0 2px 16px #0002; padding: 2.5rem 2rem; }
    .form-title { font-size: 2rem; font-weight: bold; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input, select { width: 100%; padding: 0.7rem; border-radius: 0.4rem; border: 1px solid #bbb; }
    .submit-btn { width: 100%; padding: 1rem; border-radius: 0.5rem; background: #3b0ca3; color: #fff; font-size: 1.2rem; font-weight: bold; border: none; margin-top: 1.5rem; cursor: pointer; }
    .summary { max-width: 700px; margin: 2rem auto 1.5rem auto; background: #f0f0ff; padding: 1rem; border-radius: 0.5rem; color: #333; }
    .cards { display: flex; gap: 2rem; max-width: 700px; margin: 0 auto 2rem auto; }
    .card { flex: 1; background: #fff; border-radius: 1rem; box-shadow: 0 2px 12px #0001; padding: 2rem 1rem; text-align: center; border: 2px solid #eee; transition: box-shadow 0.2s, border 0.2s; cursor: pointer; }
    .card:hover { box-shadow: 0 4px 24px #3b0ca322; border: 2px solid #3b0ca3; }
    .card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .card .title { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem; }
    .card .desc { color: #555; margin-bottom: 1rem; }
    @media (max-width: 700px) { .cards { flex-direction: column; gap: 1rem; } .full-form { padding: 1.2rem 0.5rem; } }
  </style>
</head>
<body>
  <div class="full-form">
    <div class="form-title">Find Cultural Resources</div>
    <div class="form-group">
      <label for="city">City</label>
      <input id="city" placeholder="e.g. Boston" />
    </div>
    <div class="form-group">
      <label for="country">Country</label>
      <input id="country" placeholder="e.g. USA" />
    </div>
    <div class="form-group">
      <label for="university">University</label>
      <input id="university" placeholder="e.g. Harvard" />
    </div>
    <div class="form-group">
      <label for="languages">Languages</label>
      <input id="languages" placeholder="e.g. Hindi, English" />
    </div>
    <div class="form-group">
      <label for="religion">Religion</label>
      <input id="religion" placeholder="e.g. Hindu" />
    </div>
    <div class="form-group">
      <label for="festivals">Festivals</label>
      <input id="festivals" placeholder="e.g. Diwali, Holi" />
    </div>
    <div class="form-group">
      <label for="engagement">Level of Engagement</label>
      <select id="engagement">
        <option>Casual</option>
        <option>Moderate</option>
        <option>Deep</option>
      </select>
    </div>
    <button class="submit-btn">Find Cultural Resources</button>
  </div>
  <!-- Summary and cards (shown after submit) -->
  <div class="summary">
    <strong>Boston, USA</strong> | <span>Culture: Indian</span> | <span>Engagement: Deep</span>
    <button style="float:right; background:#3b0ca3; color:#fff; border:none; border-radius:0.3rem; padding:0.3rem 1rem; margin-left:1rem;">Edit Info</button>
  </div>
  <div class="cards">
    <div class="card">
      <div class="icon">🛡️</div>
      <div class="title">Preserve My Culture</div>
      <div class="desc">Find communities, spaces, events, and resources to stay connected with your culture.</div>
    </div>
    <div class="card">
      <div class="icon">🌍</div>
      <div class="title">Cultural Understanding</div>
      <div class="desc">Explore local cultural profiles, comparisons, and integration guides for your destination.</div>
    </div>
  </div>
</body>
</html>
