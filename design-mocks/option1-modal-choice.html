<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 1: Modal Function Choice</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .full-form { max-width: 520px; margin: 3rem auto; background: #fff; border-radius: 1.2rem; box-shadow: 0 2px 16px #0002; padding: 2.5rem 2rem; }
    .form-title { font-size: 2rem; font-weight: bold; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input, select { width: 100%; padding: 0.7rem; border-radius: 0.4rem; border: 1px solid #bbb; }
    .submit-btn { width: 100%; padding: 1rem; border-radius: 0.5rem; background: #3b0ca3; color: #fff; font-size: 1.2rem; font-weight: bold; border: none; margin-top: 1.5rem; cursor: pointer; }
    /* Modal styles */
    .modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; border-radius: 1.2rem; box-shadow: 0 2px 24px #0004; padding: 2.5rem 2rem; max-width: 400px; width: 100%; text-align: center; }
    .modal-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 1.5rem; }
    .modal-btns { display: flex; flex-direction: column; gap: 1.2rem; }
    .modal-btn { padding: 1.2rem; border-radius: 0.7rem; border: none; font-size: 1.1rem; font-weight: 600; cursor: pointer; background: #e0e7ff; color: #3b0ca3; transition: background 0.2s; }
    .modal-btn:hover { background: #3b0ca3; color: #fff; }
    .modal-close { margin-top: 1.5rem; color: #888; background: none; border: none; cursor: pointer; text-decoration: underline; }
    @media (max-width: 600px) { .full-form, .modal { padding: 1.2rem 0.5rem; } }
  </style>
</head>
<body>
  <div class="full-form">
    <div class="form-title">Find Cultural Resources</div>
    <div class="form-group">
      <label for="city">City</label>
      <input id="city" placeholder="e.g. Boston" />
    </div>
    <div class="form-group">
      <label for="country">Country</label>
      <input id="country" placeholder="e.g. USA" />
    </div>
    <div class="form-group">
      <label for="university">University</label>
      <input id="university" placeholder="e.g. Harvard" />
    </div>
    <div class="form-group">
      <label for="languages">Languages</label>
      <input id="languages" placeholder="e.g. Hindi, English" />
    </div>
    <div class="form-group">
      <label for="religion">Religion</label>
      <input id="religion" placeholder="e.g. Hindu" />
    </div>
    <div class="form-group">
      <label for="festivals">Festivals</label>
      <input id="festivals" placeholder="e.g. Diwali, Holi" />
    </div>
    <div class="form-group">
      <label for="engagement">Level of Engagement</label>
      <select id="engagement">
        <option>Casual</option>
        <option>Moderate</option>
        <option>Deep</option>
      </select>
    </div>
    <button class="submit-btn">Find Cultural Resources</button>
  </div>
  <!-- Modal (shown after submit) -->
  <div class="modal-bg" style="display:block;">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title">What would you like to do next?</div>
      <div class="modal-btns">
        <button class="modal-btn">🛡️ Preserve My Culture</button>
        <button class="modal-btn">🌍 Cultural Understanding</button>
      </div>
      <button class="modal-close">Back to Edit Info</button>
    </div>
  </div>
</body>
</html>
