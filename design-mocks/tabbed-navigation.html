<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabbed Navigation Design Mock</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .tabs { display: flex; border-bottom: 2px solid #ddd; background: #fff; }
    .tab { flex: 1; padding: 1rem; text-align: center; cursor: pointer; font-weight: 600; color: #555; border: none; background: none; transition: background 0.2s; }
    .tab.active { color: #3b0ca3; border-bottom: 3px solid #3b0ca3; background: #f0f0ff; }
    .content { padding: 2rem; background: #fff; margin: 2rem auto; max-width: 600px; border-radius: 1rem; box-shadow: 0 2px 8px #0001; }
    .input-bar { background: #e0e7ff; padding: 1rem; border-radius: 0.5rem; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; }
    .input-bar label { font-weight: 600; }
    .input-bar input { padding: 0.5rem; border-radius: 0.3rem; border: 1px solid #bbb; }
    @media (max-width: 600px) { .content { padding: 1rem; margin: 1rem; } }
  </style>
</head>
<body>
  <div class="input-bar">
    <label for="city">City:</label>
    <input id="city" placeholder="e.g. Boston" />
    <label for="school">School:</label>
    <input id="school" placeholder="e.g. Harvard" />
    <label for="culture">Culture:</label>
    <input id="culture" placeholder="e.g. Indian" />
    <button style="padding:0.5rem 1rem; border-radius:0.3rem; background:#3b0ca3; color:#fff; border:none;">Update</button>
  </div>
  <div class="tabs">
    <button class="tab active">Preserve My Culture</button>
    <button class="tab">Cultural Understanding</button>
  </div>
  <div class="content">
    <h2>Preserve My Culture</h2>
    <ul>
      <li>Communities & Organizations</li>
      <li>Spaces & Resources</li>
      <li>Events & Calendar</li>
    </ul>
    <p style="color:#888">(Switch tabs above to view Cultural Understanding features)</p>
  </div>
</body>
</html>
