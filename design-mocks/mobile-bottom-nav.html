<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Bottom Navigation Design Mock</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .main { padding: 2rem; max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 1rem; box-shadow: 0 2px 8px #0001; }
    .input-bar { background: #e0e7ff; padding: 1rem; border-radius: 0.5rem; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; }
    .input-bar label { font-weight: 600; }
    .input-bar input { padding: 0.5rem; border-radius: 0.3rem; border: 1px solid #bbb; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid #ddd; display: flex; justify-content: space-around; padding: 0.5rem 0; box-shadow: 0 -2px 8px #0001; }
    .bottom-nav button { background: none; border: none; color: #3b0ca3; font-size: 1.1rem; font-weight: 600; padding: 0.7rem 1.2rem; border-radius: 0.5rem; cursor: pointer; transition: background 0.2s; }
    .bottom-nav button.active, .bottom-nav button:hover { background: #e0e7ff; }
    @media (max-width: 600px) { .main { padding: 1rem; margin: 1rem; } }
  </style>
</head>
<body>
  <div class="main">
    <div class="input-bar">
      <label for="city">City:</label>
      <input id="city" placeholder="e.g. Boston" />
      <label for="school">School:</label>
      <input id="school" placeholder="e.g. Harvard" />
      <label for="culture">Culture:</label>
      <input id="culture" placeholder="e.g. Indian" />
      <button style="padding:0.5rem 1rem; border-radius:0.3rem; background:#3b0ca3; color:#fff; border:none;">Update</button>
    </div>
    <h2>Preserve My Culture</h2>
    <ul>
      <li>Communities & Organizations</li>
      <li>Spaces & Resources</li>
      <li>Events & Calendar</li>
    </ul>
    <p style="color:#888">(Switch sections using the bottom navigation)</p>
  </div>
  <nav class="bottom-nav">
    <button class="active">My Culture</button>
    <button>Cultural Understanding</button>
    <button>Edit Info</button>
  </nav>
</body>
</html>
