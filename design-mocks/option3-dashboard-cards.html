<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 3: Dashboard with Cards</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .center { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 1rem; box-shadow: 0 2px 16px #0002; padding: 2.5rem 2rem; max-width: 400px; width: 100%; margin: 2rem 0; }
    .summary-bar { background: #e0e7ff; padding: 1rem; border-radius: 0.5rem; margin: 2rem auto 0 auto; max-width: 600px; display: flex; gap: 1.5rem; align-items: center; justify-content: space-between; }
    .summary-bar .info { color: #333; }
    .summary-bar button { background: #3b0ca3; color: #fff; border: none; border-radius: 0.3rem; padding: 0.5rem 1rem; font-weight: 600; }
    .dashboard { display: flex; gap: 2rem; margin-top: 3rem; }
    .dash-card { flex: 1; background: #fff; border-radius: 1rem; box-shadow: 0 2px 12px #0001; padding: 2rem 1rem; text-align: center; border: 2px solid #eee; transition: box-shadow 0.2s, border 0.2s; }
    .dash-card:hover { box-shadow: 0 4px 24px #3b0ca322; border: 2px solid #3b0ca3; }
    .dash-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .dash-card .title { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem; }
    .dash-card .desc { color: #555; margin-bottom: 1rem; }
    .dash-card button { margin-top: 1rem; padding: 0.7rem 1.5rem; border-radius: 0.4rem; border: none; background: #3b0ca3; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    @media (max-width: 700px) { .dashboard { flex-direction: column; gap: 1rem; } .card { padding: 1.5rem 0.7rem; } }
  </style>
</head>
<body>
  <div class="center">
    <!-- Step 1: Destination (hidden for mockup) -->
    <!-- ... -->
    <!-- After Finish: Dashboard + Summary -->
    <div class="summary-bar">
      <div class="info">
        <strong>Boston, USA</strong> | <span>Culture: Indian</span> | <span>Engagement: Deep</span>
      </div>
      <button>Edit Info</button>
    </div>
    <div class="dashboard">
      <div class="dash-card">
        <div class="icon">🛡️</div>
        <div class="title">Preserve My Culture</div>
        <div class="desc">Find communities, spaces, events, and resources to stay connected with your culture.</div>
        <button>View Details</button>
      </div>
      <div class="dash-card">
        <div class="icon">🌍</div>
        <div class="title">Cultural Understanding</div>
        <div class="desc">Explore local cultural profiles, comparisons, and integration guides for your destination.</div>
        <button>View Details</button>
      </div>
    </div>
  </div>
</body>
</html>
