<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option 1: Multi-Step Form → Function Choice</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fa; margin: 0; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 1rem; box-shadow: 0 2px 16px #0002; padding: 2.5rem 2rem; max-width: 400px; width: 100%; margin: 2rem 0; }
    .stepper { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .step { flex: 1; height: 6px; border-radius: 3px; background: #e0e7ff; }
    .step.active { background: #3b0ca3; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input, select { width: 100%; padding: 0.7rem; border-radius: 0.4rem; border: 1px solid #bbb; }
    .actions { display: flex; justify-content: space-between; gap: 1rem; }
    button { padding: 0.7rem 1.5rem; border-radius: 0.4rem; border: none; background: #3b0ca3; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    .choice-cards { display: flex; gap: 2rem; margin-top: 3rem; }
    .choice-card { flex: 1; background: #fff; border-radius: 1rem; box-shadow: 0 2px 12px #0001; padding: 2rem 1rem; text-align: center; cursor: pointer; border: 2px solid #eee; transition: box-shadow 0.2s, border 0.2s; }
    .choice-card:hover { box-shadow: 0 4px 24px #3b0ca322; border: 2px solid #3b0ca3; }
    .choice-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .choice-card .title { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.5rem; }
    .choice-card .desc { color: #555; margin-bottom: 1rem; }
    @media (max-width: 700px) { .choice-cards { flex-direction: column; gap: 1rem; } .card { padding: 1.5rem 0.7rem; } }
  </style>
</head>
<body>
  <div class="center">
    <!-- Step 1: Destination -->
    <div class="card">
      <div class="stepper">
        <div class="step active"></div>
        <div class="step"></div>
        <div class="step"></div>
      </div>
      <h2>Step 1 of 3: Destination</h2>
      <div class="form-group">
        <label for="city">City</label>
        <input id="city" placeholder="e.g. Boston" />
      </div>
      <div class="form-group">
        <label for="country">Country</label>
        <input id="country" placeholder="e.g. USA" />
      </div>
      <div class="form-group">
        <label for="university">University (optional)</label>
        <input id="university" placeholder="e.g. Harvard" />
      </div>
      <div class="actions">
        <span></span>
        <button>Next</button>
      </div>
    </div>
    <!-- Step 2: Cultural Background (hidden by default, for mockup) -->
    <!-- ... -->
    <!-- Step 3: Engagement Level (hidden by default, for mockup) -->
    <!-- ... -->
    <!-- After Finish: Function Choice -->
    <div class="choice-cards">
      <div class="choice-card">
        <div class="icon">🛡️</div>
        <div class="title">Preserve My Culture</div>
        <div class="desc">Find communities, spaces, events, and resources to stay connected with your culture.</div>
        <button>Go</button>
      </div>
      <div class="choice-card">
        <div class="icon">🌍</div>
        <div class="title">Cultural Understanding</div>
        <div class="desc">Explore local cultural profiles, comparisons, and integration guides for your destination.</div>
        <button>Go</button>
      </div>
    </div>
  </div>
</body>
</html>
