<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage Mock 2</title>
  <style>
    body { background: linear-gradient(120deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    .splitWrapper { min-height: 100vh; display: flex; flex-direction: column; align-items: stretch; }
    .leftPane { flex: 1; padding: 64px 48px 32px 10vw; display: flex; flex-direction: column; justify-content: center; }
    .leftPane h1 { font-size: 2.5rem; font-weight: 900; color: #3b0ca3; margin-bottom: 18px; }
    .leftPane p { font-size: 1.2rem; color: #222; margin-bottom: 24px; }
    .ctaBtn { background: linear-gradient(90deg, #4895ef 0%, #3b0ca3 100%); color: #fff; font-weight: 700; font-size: 1.1rem; padding: 0.8rem 2.2rem; border: none; border-radius: 2rem; box-shadow: 0 2px 12px #3b0ca344; cursor: pointer; transition: background 0.2s; }
    .ctaBtn:hover { background: linear-gradient(90deg, #3b0ca3 0%, #4895ef 100%); }
    .rightPane { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 10vw 0 0; }
    .illustration { width: 340px; max-width: 100%; border-radius: 24px; box-shadow: 0 8px 32px #0001; }
    .howItWorks { background: #fff; border-radius: 1.2rem; box-shadow: 0 2px 12px #3b0ca322; margin: 32px auto 0 auto; padding: 32px 40px; max-width: 480px; text-align: center; }
    .howItWorks h2 { color: #3b0ca3; font-size: 1.3rem; font-weight: 700; margin-bottom: 12px; }
    .howItWorks ol { list-style: decimal inside; color: #444; font-size: 1.1rem; padding-left: 0; }
    .howItWorks li { margin-bottom: 8px; }
    .mainFlex { display: flex; flex: 1; }
  </style>
</head>
<body>
  <div class="splitWrapper">
    <div class="mainFlex">
      <div class="leftPane">
        <h1>Welcome to Culture Continuity</h1>
        <p>Start your journey in a new city or university with confidence. Stay rooted in your culture while exploring new ones.</p>
        <button class="ctaBtn">Get Started</button>
      </div>
      <div class="rightPane">
        <img src="https://undraw.co/api/illustrations/undraw_city_life_gnpr.svg" alt="City Illustration" class="illustration" />
      </div>
    </div>
    <div class="howItWorks">
      <h2>How it works</h2>
      <ol>
        <li>Enter your details</li>
        <li>Discover resources and communities</li>
        <li>Connect and thrive</li>
      </ol>
    </div>
  </div>
</body>
</html>
